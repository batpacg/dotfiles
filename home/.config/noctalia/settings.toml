config_version = 14

[bar.default]
center = [
    "session",
    "launcher",
    "sysmon",
    "taskbar",
    "clock",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center"
]
compositor_blur = false
end = []
margin_ends = 0
padding = 80
position = "bottom"
radius = 0
shadow = false
start = []

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
corner_radius_scale = 0.0
font_family = "JetBrainsMono Nerd Font"

[theme]
builtin = "Gruvbox"
shell_mode = "dark"

[wallpaper]
directory = "/home/batpacg/Sync/pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/batpacg/Sync/pictures/Wallpapers/little-mage-sheep.jpg"

    [wallpaper.last]
    path = "/home/batpacg/Sync/pictures/Wallpapers/little-mage-sheep.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/batpacg/Sync/pictures/Wallpapers/little-mage-sheep.jpg"

[widget.sysmon]
capsule = true
capsule_radius = 0
stat = "gpu_temp"

[widget.taskbar]
anchor = true
capsule_radius = 0
group_by_workspace = true
icon_scale = 1.5000000000000002
item_spacing = 9
